name: Docker build

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docs/DOCKER.md
      - .github/workflows/docker-build.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docs/DOCKER.md
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build local runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image without credentials
        run: docker build --tag patchverdict:ci .

      # This job intentionally does not push or run paid AI/E2B missions.
