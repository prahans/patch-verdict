name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Tests run on untrusted pull-request code, without repository write tokens.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The committed lockfile currently lacks the application dependency graph.
      # Re-enable --frozen-lockfile after regenerating and committing a complete lockfile.
      - name: Install backend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck backend
        run: pnpm typecheck

      - name: Test backend
        run: pnpm test

  frontend:
    name: Frontend / tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # This is a separate pnpm project with its own lockfile.
      # Use frozen installs only after its dependency lock is fully populated.
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run frontend tests
        run: node --test tests/*.test.mjs

      - name: Generate Next.js route and layout types
        run: pnpm exec next typegen

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build
